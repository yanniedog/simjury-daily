name: pr-request-bot-reviews

# Best-effort request for a Codex review on every PR. This is a FALLBACK only.
#
# The reliable path is Codex "Automatic reviews", enabled per-repo at
# https://chatgpt.com/codex/settings/code-review — with that on, Codex reviews
# every PR by itself and this workflow is redundant.
#
# Caveat: the comment below is authored by github-actions[bot]. A bot-authored
# "@codex review" mention may be ignored by Codex, so do not rely on this alone.
# Also requires: (1) the ChatGPT Codex Connector GitHub App installed on the repo
# AND (2) Code review enabled for the repo in Codex settings. See README
# "Bot reviews".

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  pull-requests: write

concurrency:
  group: request-bot-reviews-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-codex:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request Codex review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "@codex review"
